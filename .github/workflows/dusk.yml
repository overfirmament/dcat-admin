name: Dusk

on:
  push:
    branches: [ 2.0 ]
  pull_request:
    branches: [ 2.0 ]

jobs:
  dusk:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        laravel: [ '12', '13' ]
        exclude:
          - php: '8.2'
            laravel: '13'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: laravel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, zip, libxml, gd, mbstring, pdo_mysql
          coverage: none

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          composer create-project --prefer-dist laravel/laravel laravel-tests "${{ matrix.laravel }}.*"
          sh ./tests/bin/install-dep.sh

      - name: Install admin
        run: sh ./tests/bin/install-admin.sh

      - name: Start server
        run: sh ./tests/bin/start.sh

      - name: Run Dusk
        run: cd laravel-tests && php artisan dusk

      - name: Upload Dusk artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-${{ matrix.php }}-${{ matrix.laravel }}
          path: |
            laravel-tests/tests/Browser/console
            laravel-tests/tests/Browser/screenshots
          if-no-files-found: ignore
